<!-- ═══════════════════════════════════════════════════════════════
     SECCIÓN REALIDAD AUMENTADA
     ─────────────────────────────────────────────────────────────
     SE SUSTITUYÓ POR UN MODULO DE JAVASCRIPT, AQUÍ LLAMAMOS A ESE MODULO PARA QUE SE ADAPTE A LOS COLORES DE LA PÁGINA Y
     EDITAR LOS TEXTOS Y EL LINNK PARA QUE SEA PERSONALIZADO DE CADA PÁGINA
     ═══════════════════════════════════════════════════════════════ -->

<div class="omh-visores-grid">
    
    <div id="visor-mazda" class="omh-visor-wrapper"></div>

    <div id="visor-mueble" class="omh-visor-wrapper"></div>

</div>

<script type="module">
    // 1. Importamos la función maestra una sola vez
    import { initOMHViewer } from '../js/visor-ar/ar-viewer.js';

    const opcionesModelo = {

      mostrarFondoHdri: false, // Si está en false (o no lo pones), oculta la foto del fondo
      bgColor: "#090909",      // Si el HDRI está oculto, pinta el fondo de este color sólido. 

      hdri: "../assets/inmob/txt/studio.hdr",

      cameraOrbit: "-45deg 80deg 85%",

      
    };
    
    // Iniciamos el visor del Mazda
    initOMHViewer('visor-mazda', '../assets/inmob/house.glb', null, opcionesModelo);


    // ==========================================
    // CONFIGURACIÓN 2: MUEBLE DE SKETCHUP
    // ==========================================
    const opcionesMueble = {

      // FONDOS (Ambos son opcionales)
        mostrarFondoHdri: false, // Si está en false (o no lo pones), oculta la foto del fondo
        bgColor: "#e5e5e5",      // Si el HDRI está oculto, pinta el fondo de este color sólido. 
                                 // (Si borras esta línea bgColor, usará el degradado negro de tu CSS).

      // 1. CÁMARA (Opcional): "horizontal vertical zoom"
        // Ej: 0deg ve el modelo totalmente de frente. 90deg de altura lo ve a ras de piso.
        cameraOrbit: "0deg 80deg 100%", 
        
        // 2. LÍMITE DE PISO (Opcional)
        // Puedes cambiar el 90deg si el modelo requiere ver un poco más abajo
        maxCameraOrbit: "auto 90deg auto",

        // 3. ENTORNO HDRI (Opcional)
        // Colocará una imagen 360 de fondo y la usará para los reflejos e iluminación.
        // Soporta .hdr o incluso un .jpg panorámico
        hdri: "../assets/inmob/txt/studio.hdr",

        materialName: "m_piedra", // El material que detectaste en SketchUp
        opciones: [
            // Opción A: Piedra 1
            { 
              tipo: "textura", 
              url: "../assets/inmob/txt/rock01.jpg", // La textura que forrará el mueble
              thumbnail: "../assets/inmob/txt/rock01.jpg" // La imagen que se verá en el botón redondo
             },
            
            // Opción B: Piedra 2
            { 
              tipo: "textura", 
              url: "../assets/inmob/txt/rock02.jpg", // La textura que forrará el mueble
              thumbnail: "../assets/inmob/txt/rock02.jpg" // La imagen que se verá en el botón redondo
            },
            
            // Opción C: Piedra 3
            { 
              tipo: "textura", 
              url: "../assets/inmob/txt/rock03.jpg", 
              thumbnail: "../assets/inmob/txt/rock03.jpg" 
            },
            // Opción D: Piedra 4
            { 
              tipo: "textura", 
              url: "../assets/inmob/txt/rock04.jpg", 
              thumbnail: "../assets/inmob/txt/rock04.jpg" 
            }
        ]
    };
    
    // Iniciamos el visor del Mueble
    initOMHViewer('visor-mueble', '../assets/inmob/kitch.glb', null, opcionesMueble);

</script>
