<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OMH Estudio | Visor AR</title>
    <link rel="icon" type="image/png" href="../assets/logos/favicon_omh.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Tera:wght@400;700;900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/colores.css">
    
    <link rel="stylesheet" href="../css/ar-viewer.css">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--negro); overflow: hidden; }
    </style>
</head>
<body>

    <div id="visor-independiente" class="omh-visor-wrapper omh-visor-standalone"></div>

    <script type="module">
        import { initOMHViewer } from '../js/visor-ar/ar-viewer.js';

        // 1. Leemos los parámetros que vienen en el link (glb y orbit)
        const params = new URLSearchParams(window.location.search);
        const glb = params.get('glb');
        const usdz = params.get('usdz'); 
        const orbit = params.get('orbit');

        // 2. Si el link trae una posición de cámara guardada, la aplicamos
        let opciones = null;
        if (orbit) {
            opciones = { cameraOrbit: orbit };
        }

        // 3. Iniciamos el visor
        if (glb) {
            initOMHViewer('visor-independiente', glb, usdz, opciones);
        } else {
            document.getElementById('visor-independiente').innerHTML = '<p style="color:white; text-align:center; margin-top:40vh; font-family:Raleway;">Modelo no encontrado en la URL.</p>';
        }
    </script>

</body>
</html>
