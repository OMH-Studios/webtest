<!-- ═══════════════════════════════════════════════════════════════
     SECCIÓN REALIDAD AUMENTADA
     ─────────────────────────────────────────────────────────────
     SE SUSTITUYÓ POR UN MODULO DE JAVASCRIPT, AQUÍ LLAMAMOS A ESE MODULO PARA QUE SE ADAPTE A LOS COLORES DE LA PÁGINA Y
     EDITAR LOS TEXTOS Y EL LINNK PARA QUE SEA PERSONALIZADO DE CADA PÁGINA
     ═══════════════════════════════════════════════════════════════ -->

    <div id="visor-mazda" class="omh-visor-wrapper"></div>

    <script type="module">
        import { initOMHViewer } from '../js/visor-ar/ar-viewer.js';

        const opcionesRobot = {
      // 1. CÁMARA (Opcional): "horizontal vertical zoom"
        // Ej: 0deg ve el modelo totalmente de frente. 90deg de altura lo ve a ras de piso.
        cameraOrbit: "0deg 90deg 90%", 
        
        // 2. LÍMITE DE PISO (Opcional)
        // Puedes cambiar el 90deg si el modelo requiere ver un poco más abajo
        maxCameraOrbit: "auto 90deg auto",
    };
        
        // Al omitir el tercer parámetro, el visor usa solo el GLB
        initOMHViewer('visor-mazda', '../assets/nosotros/test.glb', '../assets/nosotros/test.usdz', opcionesRobot);
    </script>

    <div id="botonera-anim-medio"></div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderBotonera('botonera-anim-medio', {
                bg: "negro",                   
                padding: "2rem 0",     
                align: "center",              
                tituloText: "¿Quieres ver más en Realidad Aumentada?",
                botones: [
                    { text: "CONOCER MÁS →", url: "../pages/ar_vr.html", type: "solido", targetBlank: true }
                ]
            });
        });
    </script>
