<body class="page-tours-360 page-sub">

<!-- ===================================================================
    BARRA DE NAVEGACIÓN, LLAMADA A ARCHIVO JS PARA INSERTARLO EN LA PÁGINA
     ===================================================================-->

<div id="navbar-dinamico"></div>

<!-- ===================================================================
    ENCABEZADO O HERO, LLAMADA A ARCHIVO JS PARA INSERTARLO EN LA PÁGINA
     ===================================================================-->

<div id="hero-dinamico"></div>

<!-- AQUÍ EDITAMOS LOS TEXTOS, EL VIDEO Y LA OPACIDAD EL OVERLAY-->
<script>
  window.heroConfig = {
    label: "Conoce cada rincón", 
    title: "Tours 360 &<br>Fotografía", 
    videoPath: "../assets/tours_360/tours360_bg.mp4", 
    overlayOpacity: 0.4
  };
</script>

<!-- ===================================================================
    GRID DE PROYECTOS, UN PEQUEÑO TEXTO Y DOS IMAGENES, LLAMADA A ARCHIVO JS PARA INSERTARLO EN LA PÁGINA
     ===================================================================-->

<div id="grid-proyectos-dinamico"></div>

<script>
  window.gridProyectosConfig = {
    introTitle: "Espacios Reales, <em>Experiencias Virtuales</em>", 
    introSubtitle: "Llevamos el mundo físico al digital para que veas cada rincon de tu espacio con gemelos digitales interactivos y recorridos envolventes de alta fidelidad.",
    
    proyectos: [
      {
        category: "Showroom Virtual",
        title: "Paseo Pitahaya - Atlas Desarrollos",
        mediaPath: "../assets/tours_360/360_01.jpg"
      },
      {
        category: "Google Street View",
        title: "Recorrido Comercial OMH",
        mediaPath: "../assets/tours_360/360_02.jpg"
      }
    ]
  };
</script>

<!-- ===================================================================
    VISOR 360, WIDGET DE RECORRIDO INCRUSTADO, LLAMADA A ARCHIVO JS PARA INSERTARLO EN LA PÁGINA
    -Hay que especificar en "data-config=" la ruta del TOUR que se va a visualizar
     ===================================================================-->

<div class="omh-360-widget" 
     data-config="../js/tours/tour-demo.js" 
     style="position: relative; display: block; width: 100%; max-width: 1100px; aspect-ratio: 16/9; margin: 0 auto 4rem auto; overflow: hidden; border-radius: 8px; border: 1px solid var(--gris-borde); background: #000;">
</div>

<!-- ===================================================================
    BOTON DE REGRESAR AL INICIO
     ===================================================================-->

<div id="botonera-dinamica"></div>

<script>
  window.botoneraConfig = {
    bg: "gris",                   
    padding: "5rem 0 5rem 0",     
    align: "center",              
    
    tituloText: "¡HABLANOS DE TU PROYECTO!",
    subtituloText: "", 
    
    botones: [
      { 
        text: "COTIZAR AHORA →", 
        url: "whatsapp",         // <--- Solo pones "whatsapp" y el JS jala el número de contacto.js
        msj: "¡Hola OMH Estudio! Me interesa solicitar una cotización para un Tour 360 Interactivo.", // <--- Tu mensaje personalizado por subpágina
        type: "solido",          
        targetBlank: true 
      },
      { 
        text: "← VOLVER AL INICIO", 
        url: "../index.html", 
        type: "outline",         
        targetBlank: false 
      }
    ]
  };
</script>
