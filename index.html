  /* ════════════════════════════════════════════════════════════
     ESTILOS GLOBALES Y SECCIONES ESTÁTICAS (CTA y FORM)
     Todo lo modular fue eliminado de aquí.
     ════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .section-label {
    font-family: 'Raleway', sans-serif; font-size: 0.65rem; font-weight: 700;

    font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s; cursor: none;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(204,0,0,0.4); }
  
  .btn-secondary {
    background: transparent; color: var(--blanco); padding: 0.9rem 2.5rem;
    text-decoration: none; font-family: 'Raleway', sans-serif; font-size: 0.75rem;
    font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.3); transition: border-color 0.2s, color 0.2s; cursor: none;

    font-family: 'Raleway', sans-serif; font-size: clamp(1rem, 2.5vw, 1.5rem);

  }

  .cta-content { position:relative; z-index:1; text-align:center; max-width:700px; margin:0 auto; padding:0 2rem; }

<script>
  /* Cursor personalizado - Solo para elementos estáticos de index.html (CTA, botones sueltos) */
  const cursor = document.getElementById('cursor');
  const ring   = document.getElementById('cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top  = my + 'px';
  });

  (function animRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px';
    ring.style.top  = ry + 'px';
    requestAnimationFrame(animRing);
  })();

  // Aplicado a botones fijos de CTA o formularios (los módulos ya gestionan lo suyo)
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(2)';
      ring.style.borderColor = 'var(--color-secundario)';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(1)';
      ring.style.borderColor = 'rgba(204,0,0,0.4)';
    });
  });

  /* Animaciones de aparición al hacer scroll (Para el CTA final estático) */
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  reveals.forEach(el => observer.observe(el));
</script>
